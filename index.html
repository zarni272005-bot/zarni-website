<!DOCTYPE html>
<html lang="en">
    
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Full-stack Login  & Registration</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main class="container">
            <div class="form-box" id="login-form">
                <h2>Login</h2>
                <form>
                    <div class="login-method-toggle" role="group" aria-label="Choose sign-in method">
                        <button class="method-button active" type="button" data-identifier-method="email" aria-pressed="true">Email</button>
                        <button class="method-button" type="button" data-identifier-method="phone" aria-pressed="false">Phone</button>
                    </div>
                    <input id="login-identifier" data-identifier type="email" name="identifier" placeholder="Email address" aria-label="Email address" autocomplete="email" required>
                    <input type="password" placeholder="Password" aria-label="Password" required>
                    <button type="submit">Login</button>
                </form>
                <div class="divider" aria-hidden="true"><span>or continue with</span></div>
                <div class="social-login" aria-label="Other sign-in methods">
                        <button class="social-button" type="button" data-provider="TikTok" aria-label="Continue with TikTok">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.6 7.1a7.1 7.1 0 0 1-4.3-1.5v9.1a6.1 6.1 0 1 1-5.3-6V12a2.8 2.8 0 1 0 2 2.7V2h3.3c.2 2.1 1.8 3.8 4.3 4.1z"/></svg>
                            <span>TikTok</span>
                        </button>
                        <button class="social-button" type="button" data-provider="Facebook" aria-label="Continue with Facebook">
                            <svg class="facebook-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 21v-8h2.7l.4-3.1h-3.1v-2c0-.9.3-1.5 1.6-1.5h1.7V3.6c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3v2.1H7.3V13h2.8v8z"/></svg>
                            <span>Facebook</span>
                        </button>
                        <button class="social-button" type="button" data-provider="GitHub" aria-label="Continue with GitHub">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .9a11.1 11.1 0 0 0-3.5 21.6c.6.1.8-.2.8-.6v-2.1c-3.3.7-4-1.4-4-1.4-.5-1.3-1.3-1.6-1.3-1.6-1.1-.8.1-.8.1-.8 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.6-.3-5.3-1.3-5.3-5.8 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.1 1.2a10.7 10.7 0 0 1 5.6 0c2.1-1.5 3.1-1.2 3.1-1.2.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.5-2.7 5.5-5.3 5.8.4.3.8 1 .8 2v3c0 .4.2.7.8.6A11.1 11.1 0 0 0 12 .9z"/></svg>
                            <span>GitHub</span>
                        </button>
                </div>
                <p class="auth-message" id="auth-message" aria-live="polite">Social sign-in requires setup.</p>
                <p>Don't have an account? <a href="#" data-show-form="register">Register</a></p>
            </div>

            <div class="form-box register-box" id="register-form" hidden>
                <h2>Create Account</h2>
                <p class="register-intro">Join us by creating your account</p>
                <form>
                    <input type="text" name="name" placeholder="Full Name" aria-label="Full Name" required>
                    <div class="login-method-toggle" role="group" aria-label="Choose registration contact method">
                        <button class="method-button active" type="button" data-identifier-method="email" aria-pressed="true">Email</button>
                        <button class="method-button" type="button" data-identifier-method="phone" aria-pressed="false">Phone</button>
                    </div>
                    <input id="register-identifier" data-identifier type="email" name="identifier" placeholder="Email address" aria-label="Email address" autocomplete="email" required>
                    <input type="password" placeholder="Password" aria-label="Password" required>
                    <select name="role" aria-label="Role" required>
                        <option value="">--Select Role--</option>
                        <option value="user">User</option>
                        <option value="admin">Admin</option>
                    </select>
                    <button type="submit" name="register">Register</button>
                </form>
                <div class="divider" aria-hidden="true"><span>or continue with</span></div>
                <div class="social-login" aria-label="Register with another account">
                    <button class="social-button" type="button" data-provider="TikTok" aria-label="Continue with TikTok">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.6 7.1a7.1 7.1 0 0 1-4.3-1.5v9.1a6.1 6.1 0 1 1-5.3-6V12a2.8 2.8 0 1 0 2 2.7V2h3.3c.2 2.1 1.8 3.8 4.3 4.1z"/></svg>
                        <span>TikTok</span>
                    </button>
                    <button class="social-button" type="button" data-provider="Facebook" aria-label="Continue with Facebook">
                        <svg class="facebook-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 21v-8h2.7l.4-3.1h-3.1v-2c0-.9.3-1.5 1.6-1.5h1.7V3.6c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3v2.1H7.3V13h2.8v8z"/></svg>
                        <span>Facebook</span>
                    </button>
                    <button class="social-button" type="button" data-provider="GitHub" aria-label="Continue with GitHub">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .9a11.1 11.1 0 0 0-3.5 21.6c.6.1.8-.2.8-.6v-2.1c-3.3.7-4-1.4-4-1.4-.5-1.3-1.3-1.6-1.3-1.6-1.1-.8.1-.8.1-.8 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.6-.3-5.3-1.3-5.3-5.8 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.1 1.2a10.7 10.7 0 0 1 5.6 0c2.1-1.5 3.1-1.2 3.1-1.2.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.5-2.7 5.5-5.3 5.8.4.3.8 1 .8 2v3c0 .4.2.7.8.6A11.1 11.1 0 0 0 12 .9z"/></svg>
                        <span>GitHub</span>
                    </button>
                </div>
                <p class="auth-message" aria-live="polite">Social sign-in requires OAuth setup.</p>
                <p>Already have an account? <a href="#" data-show-form="login">Login</a></p>
            </div>
        </main>
        <script>
            document.querySelectorAll("[data-provider]").forEach((button) => {
                button.addEventListener("click", () => {
                    const message = button.closest(".form-box").querySelector(".auth-message");
                    message.textContent = `${button.dataset.provider} sign-in needs OAuth setup before it can be used.`;
                });
            });

            document.querySelectorAll(".login-method-toggle").forEach((toggle) => {
                const identifier = toggle.parentElement.querySelector("[data-identifier]");

                toggle.querySelectorAll("[data-identifier-method]").forEach((button) => {
                    button.addEventListener("click", () => {
                        const usePhone = button.dataset.identifierMethod === "phone";
                        identifier.type = usePhone ? "tel" : "email";
                        identifier.placeholder = usePhone ? "Phone number" : "Email address";
                        identifier.setAttribute("aria-label", usePhone ? "Phone number" : "Email address");
                        identifier.autocomplete = usePhone ? "tel" : "email";

                        toggle.querySelectorAll("[data-identifier-method]").forEach((methodButton) => {
                            const isActive = methodButton === button;
                            methodButton.classList.toggle("active", isActive);
                            methodButton.setAttribute("aria-pressed", String(isActive));
                        });
                    });
                });
            });

            document.querySelectorAll("[data-show-form]").forEach((link) => {
                link.addEventListener("click", (event) => {
                    event.preventDefault();
                    const showRegister = link.dataset.showForm === "register";
                    document.getElementById("login-form").hidden = showRegister;
                    document.getElementById("register-form").hidden = !showRegister;
                });
            });
        </script>
    </body>
</html>
